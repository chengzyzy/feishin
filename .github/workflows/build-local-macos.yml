name: Build local macOS arm64

on:
  push:
    branches:
      - codex/fix-feishin-security-v261111
  workflow_dispatch:

concurrency:
  group: feishin-local-arm64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.2'
  PNPM_VERSION: '11.5.2'
  ELECTRON_VERSION: '43.8.8'
  ELECTRON_ARCHIVE: electron-v43.8.8-darwin-arm64.zip
  ELECTRON_SHA256: 3c6d3425e91885b5c2deecfdb97e4392040785106f10b32cc50c964cdd2203a7
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      dmg-artifact-id: ${{ steps.dmg.outputs.artifact-id }}
      dmg-sha256: ${{ steps.dmg.outputs.artifact-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify runner architecture
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install locked dependencies
        # Prepare the verified Electron archive before running app dependency scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download and verify Electron arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          curl \
            --fail \
            --location \
            --http1.1 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 240 \
            --retry-max-time 480 \
            --output "$RUNNER_TEMP/$ELECTRON_ARCHIVE" \
            "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/${ELECTRON_ARCHIVE}"
          echo "${ELECTRON_SHA256}  $RUNNER_TEMP/${ELECTRON_ARCHIVE}" | shasum -a 256 -c -
          shasum -a 256 "$RUNNER_TEMP/$ELECTRON_ARCHIVE" | tee dist/electron-sha256.txt

      - name: Prepare verified Electron dist for dependency scripts
        run: |
          set -euo pipefail
          mkdir -p node_modules/electron/dist
          ditto -x -k "$RUNNER_TEMP/$ELECTRON_ARCHIVE" node_modules/electron/dist
          printf '%s' 'Electron.app/Contents/MacOS/Electron' > node_modules/electron/path.txt
          printf 'v%s' "$ELECTRON_VERSION" > node_modules/electron/dist/version

      - name: Run app dependency scripts
        run: pnpm exec electron-builder install-app-deps

      - name: Lint and typecheck
        run: pnpm run lint

      - name: Security regression
        run: pnpm run test:security

      - name: Dependency audit (bounded, remaining advisories recorded)
        run: node scripts/security-audit.mjs --output dist/audit --timeout-ms 180000

      - name: Build application bundles
        run: pnpm run build

      - name: Package independent arm64 app
        run: |
          set -euo pipefail
          pnpm exec electron-builder \
            --config electron-builder-local.yml \
            --mac dmg:arm64 zip:arm64 \
            --publish never \
            -c.electronDist="$RUNNER_TEMP/$ELECTRON_ARCHIVE" \
            2>&1 | tee dist/build.log

      - name: Build fingerprints
        run: |
          set -euo pipefail
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "git_branch=$(git rev-parse --abbrev-ref HEAD)"
            echo "electron_version=${ELECTRON_VERSION}"
            echo "electron_archive_sha256=$(shasum -a 256 "$RUNNER_TEMP/$ELECTRON_ARCHIVE" | awk '{print $1}')"
            shasum -a 256 package.json pnpm-lock.yaml pnpm-workspace.yaml electron-builder-local.yml .github/workflows/build-local-macos.yml
          } | tee dist/fingerprints.txt

      - name: Verify DMG, ZIP, architecture, identity and signature
        run: bash scripts/verify-macos-artifacts.sh dist

      - name: Verify first launch on a fresh profile
        run: |
          set -euo pipefail
          app="dist/mac-arm64/Feishin Local.app/Contents/MacOS/Feishin Local"
          profile="$HOME/Library/Application Support/Feishin Local"
          test ! -e "$profile"
          "$app" > dist/startup.log 2>&1 &
          app_pid=$!
          stop_app() {
            local exit_code=0
            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid"
            fi
            # wait may report the SIGTERM used to stop the smoke test.
            wait "$app_pid" || exit_code=$?
            echo "Smoke test process exit code: $exit_code"
          }
          trap stop_app EXIT
          for attempt in {1..30}; do
            if grep -Fq 'Main window created' dist/startup.log; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat dist/startup.log
          grep -Fq 'Main window created' dist/startup.log
          kill -0 "$app_pid"
          test -d "$profile"
          stop_app
          trap - EXIT
          echo "First launch created the Feishin Local profile and the test process exited."

      - name: Upload verified DMG
        id: dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/*.dmg
          archive: false
          if-no-files-found: error

      - name: Verify uploaded DMG digest
        env:
          UPLOADED_DMG_SHA256: ${{ steps.dmg.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          read -r verified_sha _ < dist/SHA256SUMS
          if [[ "$UPLOADED_DMG_SHA256" != "$verified_sha" ]]; then
            echo '::error::Uploaded DMG SHA-256 differs from SHA256SUMS'
            exit 1
          fi
          printf 'DMG SHA-256 `%s`\n' "$verified_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP and verification reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feishin-local-macos-arm64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/verification.txt
            dist/entitlements.plist
            dist/fingerprints.txt
            dist/build.log
            dist/startup.log
            dist/electron-sha256.txt
            dist/audit/audit.json
            dist/audit/audit-summary.txt
            dist/audit/audit.stderr.log
            dist/audit/audit-command.txt
          if-no-files-found: error

  publish-nightly:
    needs: build
    if: github.repository == 'chengzyzy/feishin' && github.ref == 'refs/heads/codex/fix-feishin-security-v261111'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-local-nightly.yml
    with:
      artifact-id: ${{ needs.build.outputs.dmg-artifact-id }}
      expected-sha256: ${{ needs.build.outputs.dmg-sha256 }}

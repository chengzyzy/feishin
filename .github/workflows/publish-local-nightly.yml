name: Publish verified Feishin Nightly

on:
  push:
    branches:
      - codex/fix-feishin-security-v261111
    paths:
      - .github/workflows/publish-local-nightly.yml

permissions: {}

concurrency:
  group: feishin-local-nightly-20261111-446d9c0

jobs:
  publish:
    if: github.repository == 'chengzyzy/feishin'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified arm64 DMG from run 43005237973
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: '43005237973'
          artifact-ids: '13849025398'
          path: ${{ runner.temp }}/feishin-nightly
          digest-mismatch: error

      - name: Verify SHA-256 and publish the Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/feishin-nightly"
          source_dmg='Feishin Local-1.17.0-mac-arm64.dmg'
          release_dmg=Feishin-1.17.0-mac-arm64.dmg
          nightly_tag=nightly-20261111-446d9c0
          read -r actual_sha _ < <(sha256sum "$source_dmg")
          if [[ "$actual_sha" != '7deefb0c935dc823ccf0235aa73d09964692853bd25645ada94df1f160923e1f' ]]; then
            echo '::error::DMG SHA-256 mismatch'
            exit 1
          fi
          # The Actions token cannot create tags for commits with workflow changes.
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$nightly_tag" --jq '.object | select(.type == "commit") | .sha')"
          if [[ "$tag_commit" != '446d9c0778c15c86427d73ed4c9b977d658efc94' ]]; then
            echo '::error::Nightly tag does not point to the verified build commit'
            exit 1
          fi
          mv "$source_dmg" "$release_dmg"

          cat > release-notes.md <<'NOTES'
          Feishin 1.17.0 Nightly，适用于 Apple 芯片的 Mac。安装文件为 `Feishin Local.app`，Dock 显示 **Feishin**。

          DMG 来自 [已验证的构建 #43005237973](https://github.com/chengzyzy/feishin/actions/runs/43005237973)，源码提交为 `446d9c0778c15c86427d73ed4c9b977d658efc94`。CI 核对了显示名、架构、应用标识、签名完整性和空白配置首次启动。

          应用采用 ad-hoc 签名，未做 Apple 公证。

          DMG SHA-256 `7deefb0c935dc823ccf0235aa73d09964692853bd25645ada94df1f160923e1f`
          NOTES

          gh release create "$nightly_tag" "$release_dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease --latest=false \
            --title 'Feishin Nightly 2026-11-11' --notes-file release-notes.md
